version: "3.9"

# ==============================================================================
# Smart Campus Agentic RAG Platform — Local Development
# Ollama serves both the chat/tool-calling model and the embedding model.
# Supabase is cloud-hosted (not run locally) — set SUPABASE_URL / keys in .env.
# ==============================================================================

services:

  ollama:
    image: ollama/ollama:latest
    container_name: campus_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment for GPU-accelerated cloud instances (requires NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [campus_network]

  ollama-model-init:
    image: curlimages/curl:latest
    container_name: campus_ollama_model_init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
      echo 'Pulling nomic-embed-text (768-dim embeddings)...' &&
      curl -s http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}' &&
      echo 'Pulling llama3 (chat + tool-calling agent)...' &&
      curl -s http://ollama:11434/api/pull -d '{\"name\": \"llama3\"}' &&
      echo 'Models ready.'
      "
    networks: [campus_network]

  backend:
    build: ./backend
    container_name: campus_backend
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks: [campus_network]

  frontend:
    build: ./frontend
    container_name: campus_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks: [campus_network]

networks:
  campus_network:
    driver: bridge

volumes:
  ollama_data:
