version: "3.9"

# ==============================================================================
# Smart Campus Agentic RAG Platform — Production
# Supabase remains cloud-hosted (DB/Auth/Storage). This stack runs: the
# self-hosted Ollama inference engine, the FastAPI backend, the Next.js
# frontend, and Nginx as the TLS-terminating reverse proxy in front of both.
# ==============================================================================

services:

  ollama:
    image: ollama/ollama:latest
    container_name: campus_ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits: { cpus: "4", memory: 16G }
        # Attach a GPU on cloud instances via the NVIDIA Container Toolkit:
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [campus_network]
    # No host port mapping — only reachable inside the compose network.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io/your-org}/campus-backend:${IMAGE_TAG:-latest}
    container_name: campus_backend
    restart: always
    env_file: .env.production
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      ENVIRONMENT: production
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1", memory: 2G }
    networks: [campus_network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.yourdomain.edu}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    image: ${REGISTRY:-ghcr.io/your-org}/campus-frontend:${IMAGE_TAG:-latest}
    container_name: campus_frontend
    restart: always
    depends_on: [backend]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1", memory: 1G }
    networks: [campus_network]

  nginx:
    image: nginx:1.27-alpine
    container_name: campus_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [backend, frontend]
    networks: [campus_network]

networks:
  campus_network:
    driver: bridge

volumes:
  ollama_data:
